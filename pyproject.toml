[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gpu-broker"
version = "0.3.0"
description = "A GPU queue designed for coding agents on one shared machine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Agent4Kernel"}]
dependencies = []

[project.scripts]
gpuq = "agent_gpu_broker.cli:main"
gpu-run = "agent_gpu_broker.cli:gpu_run_main"

[tool.setuptools.packages.find]
where = ["src"]
